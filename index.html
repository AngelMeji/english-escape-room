<!DOCTYPE html>
<html lang="en"> <!-- Idioma principal del documento -->
<head>
    <meta charset="UTF-8"> <!-- Soporte para caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividad en móviles -->
    <title>Escape-Room</title> <!-- Título en pestaña del navegador -->

    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Capa visual para efecto de niebla -->
    <div class="fog-layer"></div>

    <!-- Capa usada para efecto de parpadeo en pantalla -->
    <div class="flicker-overlay hidden"></div>

    <!-- ================================
         PANTALLA INICIAL
    ================================== -->
    <div id="start-screen" class="screen-container">
        <div class="content-box">
            <h1 class="game-title">THE ENGLISH ESCAPE ROOM</h1>

            <p class="instructions subtitle">
                Solve the puzzles... or remain trapped forever.
            </p>

            <!-- Entrada del nombre del jugador -->
            <input type="text" id="player-name-input" placeholder="Enter your name, prisoner..." aria-label="Player Name">

            <!-- Botón para iniciar el juego -->
            <button id="start-button">Enter If You Dare</button>

            <!-- Mensaje de error si no escribe su nombre -->
            <p id="name-error" class="error-message"></p>
        </div>
    </div>

    <!-- ================================
         PANTALLA DEL JUEGO
    ================================== -->
    <div id="game-screen" class="screen-container hidden">

        <!-- Barra superior con info del jugador -->
        <header class="game-header">
            <div id="player-info">
                Prisoner: <span id="player-name-display"></span> <!-- Nombre del jugador -->
            </div>

            <div id="room-indicator">Room 1/8</div> <!-- Nivel actual -->

            <div id="score">Score: 0</div> <!-- Puntuación -->

            <div id="timer">Time: 00:00</div> <!-- Tiempo transcurrido -->
        </header>

        <main id="game-area">

            <!-- Contenedor donde se muestran los desafíos -->
            <div id="challenge-container" class="content-box">

                <div id="challenge-content">
                    <!-- Pregunta principal -->
                    <h2 id="challenge-question"></h2>

                    <!-- Párrafo oculto (lecturas, textos largos, acertijos, etc.) -->
                    <p id="challenge-paragraph" class="hidden"></p>

                    <!-- Opciones (solo si el reto es de selección múltiple) -->
                    <div id="multiple-choice-options" class="hidden"></div>
                </div>

                <!-- Campo para respuesta escrita -->
                <input type="text" id="answer-input" placeholder="Your answer..." aria-label="Answer">

                <!-- Botones principales -->
                <div class="button-group">
                    <button id="check-answer-btn">Submit Answer</button>
                    <button id="hint-btn">Hint (-50 pts)</button>
                </div>

                <!-- Mensaje de retroalimentación (correcto/incorrecto) -->
                <p id="feedback-message"></p>
            </div>

            <!-- Contenedor gráfico de la puerta -->
            <div id="door-container">
                <div class="door-frame">
                    <!-- Puerta que se animará al avanzar -->
                    <div id="door" class="door">
                        <div class="door-handle"></div> <!-- Manija de la puerta -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ================================
         PANTALLA FINAL
    ================================== -->
    <div id="end-screen" class="screen-container hidden">
        <div class="content-box">
            <h2 class="congrats-title">Congratulations! You Have Escaped!</h2>

            <p>Your freedom was earned, <span id="final-player-name"></span></p>

            <!-- Datos finales del jugador -->
            <p id="final-score"></p>
            <p id="final-time"></p>
            <p id="high-score"></p>

            <!-- Lista de palabras aprendidas durante el juego -->
            <h3>Words you mastered:</h3>
            <ul id="learned-words-list"></ul>

            <!-- Botón para reiniciar -->
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <!-- ================================
         AUDIOS DEL JUEGO
         (El usuario debe añadir los archivos)
    ================================== -->
    <audio id="correct-sound" src="sounds/correct.wav" preload="auto"></audio>
    <audio id="incorrect-sound" src="sounds/incorrect.wav" preload="auto"></audio>
    <audio id="door-open-sound" src="sounds/door-creak.wav" preload="auto"></audio>
    <audio id="victory-sound" src="sounds/victory.wav" preload="auto"></audio>
    <audio id="background-music" src="sounds/background.mp3" loop preload="auto"></audio>

    <!-- Archivo principal de JavaScript -->
    <script type="module" src="./main.js"></script>
</body>
</html>
